version: "3.8"

services:
  kahoot_postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kahoot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${KAHOOT_DB_PASSWORD:?Defina KAHOOT_DB_PASSWORD}"
    volumes:
      - kahoot_postgres_data:/var/lib/postgresql/data
    networks:
      - cloudbrnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kahoot_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  kahoot_app:
    image: ghcr.io/josemaeldon/kahoot:latest
    environment:
      DATABASE_URL: "postgresql://postgres:${KAHOOT_DB_PASSWORD:?Defina KAHOOT_DB_PASSWORD}@kahoot_postgres:5432/kahoot_db"
      DATABASE_POOL_SIZE: "10"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}"
      COOKIE_SECURE: "true"
      NODE_ENV: production
      PORT: "3000"
      BACKEND_PORT: "8000"
      PLAYER_RECONNECT_GRACE_SECONDS: "120"
      MIGRATIONS_DIR: /app/db/migrations
    networks:
      - cloudbrnet
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=cloudbrnet
        - traefik.http.routers.kahoot_app.rule=Host(`play.cloudbr.app`)
        - traefik.http.routers.kahoot_app.entrypoints=websecure
        - traefik.http.routers.kahoot_app.tls=true
        - traefik.http.routers.kahoot_app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.kahoot_app.tls.domains[0].main=play.cloudbr.app
        - traefik.http.services.kahoot_app.loadbalancer.server.port=3000

networks:
  cloudbrnet:
    external: true

volumes:
  kahoot_postgres_data:
    driver: local
