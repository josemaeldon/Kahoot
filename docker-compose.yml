version: "3.8"

services:
  play_postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: play_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PLAY_DB_PASSWORD:?Defina PLAY_DB_PASSWORD}"
    volumes:
      - play_postgres_data:/var/lib/postgresql/data
    networks:
      - cloudbrnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d play_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  play_app:
    image: "${PLAY_IMAGE:-ghcr.io/josemaeldon/play:latest}"
    environment:
      DATABASE_URL: "postgresql://postgres:${PLAY_DB_PASSWORD:?Defina PLAY_DB_PASSWORD}@play_postgres:5432/play_db"
      DATABASE_POOL_SIZE: "10"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}"
      COOKIE_SECURE: "true"
      NODE_ENV: production
      PORT: "3000"
      BACKEND_PORT: "8000"
      PLAYER_RECONNECT_GRACE_SECONDS: "120"
      MIGRATIONS_DIR: /app/db/migrations
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - cloudbrnet
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=cloudbrnet
        - traefik.http.routers.play_app.rule=Host(`play.cloudbr.app`)
        - traefik.http.routers.play_app.entrypoints=websecure
        - traefik.http.routers.play_app.tls=true
        - traefik.http.routers.play_app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.play_app.tls.domains[0].main=play.cloudbr.app
        - traefik.http.services.play_app.loadbalancer.server.port=3000

networks:
  cloudbrnet:
    external: true

volumes:
  play_postgres_data:
    driver: local
